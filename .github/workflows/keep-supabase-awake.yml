# Keep the exercise app's Supabase project from being paused.
#
# Free Supabase projects are paused automatically after about a week without
# activity, and a paused project is simply gone from the internet: every sync
# fails, and the app quietly stops backing anything up. That is what happened
# to exercise-group — it was paused in July and nobody noticed for weeks.
#
# This runs one tiny query a day, which counts as activity, so the project
# never goes idle long enough to be paused.
#
# One-time setup: add ONE repository secret, SUPABASE_ANON_KEY — the
# "anon public" key from the project's API Keys page. The project address
# below is not a secret (it unlocks nothing on its own), so it lives here;
# the key stays out of this public repository.
#   Key:    https://supabase.com/dashboard/project/slmdajpohfxdubhkuusk/settings/api-keys
#   Secret: https://github.com/cheskelsbreuer-bit/excersize/settings/secrets/actions/new
#
# If this workflow ever turns red, the project is unreachable: open
# supabase.com/dashboard and press Restore.

name: Keep Supabase awake

on:
  schedule:
    - cron: '17 9 * * *'   # once a day, 09:17 UTC
  workflow_dispatch:
    inputs:
      force_keepalive:
        description: 'Make the keep-active commit now even if one is not due'
        default: 'false'

permissions:
  contents: write   # only for the monthly keep-active commit below

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # GitHub switches off scheduled workflows in a public repository after
      # 60 days without a commit — which would quietly stop the ping above,
      # and a week later Supabase would pause the project again. So when the
      # last commit is more than 30 days old, this records one tiny commit.
      # Checked every day, so a missed run is caught the next day.
      - uses: actions/checkout@v6
      - name: Keep this repository active
        continue-on-error: true
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ($(date +%s) - last) / 86400 ))
          echo "Last commit was $age_days days ago."
          if [ "$age_days" -lt 30 ] && [ "${{ github.event_name }}" != "workflow_dispatch" -o "${{ inputs.force_keepalive }}" != "true" ]; then
            echo "Recent enough, nothing to do."
            exit 0
          fi
          date -u +%F > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "Keep scheduled jobs active (GitHub disables them after 60 idle days)"
          git push
      - name: Query the project so it counts as activity
        env:
          URL: https://slmdajpohfxdubhkuusk.supabase.co
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::SUPABASE_ANON_KEY is not set, so nothing is keeping the"
            echo "::warning::project awake. Copy the anon key from"
            echo "::warning::supabase.com/dashboard/project/slmdajpohfxdubhkuusk/settings/api-keys"
            echo "::warning::and add it as a repository secret named SUPABASE_ANON_KEY."
            exit 0
          fi
          code=$(curl -sS --max-time 60 -o body.txt -w '%{http_code}' \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "${URL%/}/rest/v1/app_data?select=user_id&limit=1") || code=000
          echo "HTTP $code"
          if [ "$code" = "200" ]; then
            echo "Project is awake."
            exit 0
          fi
          head -c 300 body.txt || true; echo
          if [ "$code" = "000" ]; then
            echo "::error::The project could not be reached at all. A paused Supabase"
            echo "::error::project looks exactly like this. Open supabase.com/dashboard,"
            echo "::error::open the project and press Restore (possible for 90 days"
            echo "::error::after it pauses)."
          elif [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::error::The project rejected the key. Copy the anon public key again"
            echo "::error::from Project Settings -> API and update the SUPABASE_ANON_KEY secret."
          elif [ "$code" = "404" ]; then
            echo "::error::The app_data table is missing. Run the setup SQL from the app:"
            echo "::error::Menu -> Earlier versions -> Copy SQL."
          fi
          exit 1
